{% extends 'base.html' %}

{% block content %}

<h2>Room Allocation</h2>

<div class="card p-4">

    <form>

        <div class="mb-3">
            <label>Student Name</label>
            <input type="text" class="form-control">
        </div>

        <div class="mb-3">
            <label>Room Number</label>
            <input type="text" class="form-control">
        </div>

        <button class="btn btn-primary">
            Allocate Room
        </button>

    </form>

</div>

{% endblock %}
