
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRAVAAH Hostel Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#e9e9e7;
            min-height:80vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, Helvetica, sans-serif;
            margin: 0;
        }

        .login-container{
            width:100%;
            max-width:500px;
        }

        .login-card{
            background:white;
            border:4px solid #000;
            box-shadow:10px 10px 0px #E56A35;
        }

        .logo-section{
            text-align:center;
            padding:30px 20px 15px;
        }

        .logo{
            font-size:56px;
            font-weight:900;
            letter-spacing:2px;
        }

        .logo-black{
            color:#000;
        }

        .logo-orange{
            color:#E56A35;
        }

        .subtitle{
            color:#777;
            text-transform:uppercase;
            letter-spacing:3px;
            font-size:14px;
            margin-top:10px;
        }

        .divider{
            height:4px;
            background:#E56A35;
        }

        .card-body{
            padding:35px;
        }

        .form-label{
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:1px;
        }

        .form-control{
            border:2px solid #000;
            border-radius:0;
            padding:12px;
        }

        .form-control:focus{
            border-color:#E56A35;
            box-shadow:none;
        }

        .btn-login{
            width:100%;
            background:#E56A35;
            color:white;
            border:3px solid black;
            border-radius:0;
            font-weight:700;
            text-transform:uppercase;
            letter-spacing:2px;
            padding:12px;
            transition:0.3s;
        }

        .btn-login:hover{
            background:#d45d2b;
            color:white;
            transform:translateY(-2px);
        }

        .module-text{
            text-align:center;
            margin-top:20px;
            color:#888;
            letter-spacing:2px;
            text-transform:uppercase;
        }

        .alert{
            border-radius:0;
            border-left:5px solid red;
        }

    </style>
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo-section">

            <div class="logo">
                <span class="logo-black">PRAVA</span><span class="logo-orange">AH</span>
            </div>

            <div class="subtitle">
                Hostel Management System
            </div>

        </div>

        <div class="divider"></div>

        <div class="card-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter Username"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter Password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-login">
                    Login
                </button>

            </form>

            <div class="module-text">
                Hostel Room Allocation Module
            </div>

        </div>

    </div>

</div>

</body>
</html>
```
