```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

    :root{
        --black:#0a0a0a;
        --white:#f5f5f0;
        --orange:#ff5c1a;
        --navy:#0f1e45;
        --sidebar-width:260px;
        --topbar-height:70px;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:Segoe UI, sans-serif;
        background:var(--white);
        min-height:100vh;
    }

    /* TOPBAR */

    .topbar{
        position:fixed;
        top:0;
        left:0;
        right:0;
        height:var(--topbar-height);
        background:white;
        border-bottom:3px solid var(--orange);
        z-index:1000;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 30px;
    }

    .brand{
        font-size:28px;
        font-weight:800;
        color:var(--black);
        letter-spacing:1px;
    }

    .brand span{
        color:var(--orange);
    }

    .top-user{
        font-weight:600;
        color:var(--navy);
    }

    /* SIDEBAR */

    .sidebar{
        position:fixed;
        top:var(--topbar-height);
        left:0;
        width:var(--sidebar-width);
        height:100vh;
        background:var(--black);
        padding-top:25px;
    }

    .sidebar-title{
        color:white;
        padding:0 25px;
        margin-bottom:20px;
        text-transform:uppercase;
        letter-spacing:2px;
        font-size:13px;
    }

    .sidebar a{
        display:flex;
        align-items:center;
        gap:12px;
        color:rgba(255,255,255,.75);
        text-decoration:none;
        padding:15px 25px;
        transition:.3s;
        font-weight:500;
    }

    .sidebar a:hover{
        background:rgba(255,255,255,.05);
        color:white;
        border-left:4px solid var(--orange);
    }

    .sidebar a i{
        width:20px;
        text-align:center;
    }

    /* CONTENT */

    .content{
        margin-left:var(--sidebar-width);
        margin-top:var(--topbar-height);
        padding:35px;
    }

    /* PAGE TITLE */

    .page-title{
        font-size:36px;
        font-weight:800;
        color:var(--black);
        margin-bottom:5px;
    }

    .page-title span{
        color:var(--orange);
    }

    .page-subtitle{
        color:#666;
        margin-bottom:30px;
    }

    /* CARDS */

    .stat-card{
        background:white;
        border:2px solid var(--black);
        padding:25px;
        transition:.3s;
        height:100%;
    }

    .stat-card:hover{
        transform:translateY(-4px);
    }

    .stat-icon{
        font-size:28px;
        color:var(--orange);
        margin-bottom:15px;
    }

    .stat-number{
        font-size:36px;
        font-weight:800;
        color:var(--black);
    }

    .stat-label{
        color:#666;
        text-transform:uppercase;
        font-size:13px;
        letter-spacing:1px;
    }

    /* TABLE */

    .custom-table{
        background:white;
        border:2px solid var(--black);
    }

    .custom-table thead{
        background:var(--black);
        color:white;
    }

    /* BUTTONS */

    .btn-pravaah{
        background:var(--orange);
        color:white;
        border:none;
        padding:10px 22px;
        font-weight:600;
    }

    .btn-pravaah:hover{
        background:#d9490f;
        color:white;
    }

    /* FORM */

    .form-card{
        background:white;
        border:2px solid var(--black);
        padding:30px;
    }

    .form-control{
        border:2px solid #ddd;
    }

    .form-control:focus{
        border-color:var(--orange);
        box-shadow:none;
    }

</style>
```

</head>

<body>

```
<!-- TOPBAR -->

<div class="topbar">

</div>

    </a>

</div>

<!-- CONTENT -->

<div class="content">

    {% endblock %}

</div>
